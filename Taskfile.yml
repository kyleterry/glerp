version: "3"

vars:
  BIN: glerp
  CMD: ./cmd/glerp
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  build:
    desc: Build the glerp binary
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.BIN}} {{.CMD}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"

  run:
    desc: Build and run the REPL
    deps: [build]
    cmds:
      - ./{{.BIN}}
    interactive: true

  eval:
    desc: Evaluate a scheme expression (task eval -- '(+ 1 2)')
    deps: [build]
    cmds:
      - echo '{{.CLI_ARGS}}' | ./{{.BIN}}

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:v:
    desc: Run all tests (verbose)
    cmds:
      - go test -v ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  check:
    desc: Run linter, vetter and tests
    cmds:
      - task: vet
      - task: lint
      - task: test

  ci:
    desc: Run the full CI pipeline locally
    cmds:
      - task: build
      - task: check

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .
      - golines -w .

  install:
    desc: Install glerp to $GOPATH/bin
    cmds:
      - go install -ldflags "-X main.version={{.VERSION}}" {{.CMD}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BIN}}
